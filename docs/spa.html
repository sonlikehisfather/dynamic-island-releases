<style>
/* Mise en page : SPA sombre, sections denses en colonnes ; nav en verre flottante, footer en 4 colonnes. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --panel: #0B0B0F;
  --fg: #F5F5F7;
  --muted: #8E8E99;
  --line: rgba(255,255,255,.10);
  --violet: #7C5CFF;
  --cyan: #22D3EE;
  --pink: #FF4FD8;
  --green: #30D158;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: 'Inter', 'SF Pro Display', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.04em; }
.muted { color: var(--muted); }
.line { border-color: var(--line); }
.grad { background: linear-gradient(100deg, var(--violet), var(--cyan) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glass { background: rgba(20,20,26,.55); border: 1px solid var(--line); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); }
.panel { background: var(--panel); border: 1px solid var(--line); }
.chip { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 10px; }
.bento-card { --x: 50%; --y: 50%; }
.bento-card .spot { background: radial-gradient(380px circle at var(--x) var(--y), rgba(124,92,255,.18), transparent 60%); }
.eq i { display: block; width: 3px; border-radius: 2px; background: var(--cyan); animation: eq 1s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: .25s } .eq i:nth-child(3) { animation-delay: .5s } .eq i:nth-child(4) { animation-delay: .15s }
@keyframes eq { from { height: 4px } to { height: 18px } }
.frame { border-radius: 24px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); max-width: 100%; }
.frame img { display: block; width: 100%; height: auto; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// Framer Motion (avec repli sans animation si la librairie ne charge pas)
const FM = window.Motion || {};
const passthrough = new Proxy({}, { get: (_, tag) => React.forwardRef(({ initial, animate, exit, whileHover, whileTap, whileInView, viewport, transition, variants, layout, layoutId, ...p }, ref) => React.createElement(tag, { ...p, ref })) });
const motion = FM.motion || passthrough;
const AnimatePresence = FM.AnimatePresence || (({ children }) => children);
const useInView = FM.useInView || (() => true);
const useScroll = FM.useScroll;
const useTransform = FM.useTransform;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const EASE = [0.16, 1, 0.3, 1];
const DL = "https://github.com/sonlikehisfather/dynamic-island-releases/releases/latest/download/DynamicIsland-win-Setup.exe";
// Serveur (Cloudflare Worker) des comptes et de la messagerie : même adresse que le serveur de licences de l'appli (src/Core/LicenseServer.cs)
const API = "https://dynamic-island-licenses.dynamic-island-licenses.workers.dev";
const PAGES = [
  { id: "accueil", label: "Accueil" },
  { id: "technologie", label: "Technologie" },
  { id: "configurer", label: "Configurer" },
  { id: "apropos", label: "À propos" },
];

/* ───────────── Icônes (traits simples) ───────────── */
const Icon = ({ d, className = "h-6 w-6" }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
    {d.map((p, i) => <path key={i} d={p} />)}
  </svg>
);
const I = {
  music: ["M9 18V5l12-2v13", "M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z", "M21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"],
  bell: ["M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9", "M10.3 21a1.94 1.94 0 0 0 3.4 0"],
  game: ["M6 12h4M8 10v4", "M15 13h.01M18 11h.01", "M17.3 5H6.7a4 4 0 0 0-3.9 3.2L2 15a3 3 0 0 0 5.4 2.3L9 15h6l1.6 2.3A3 3 0 0 0 22 15l-.8-6.8A4 4 0 0 0 17.3 5Z"],
  camera: ["M23 7l-7 5 7 5V7Z", "M1 5h15v14H1z"],
  spark: ["M12 3v4M12 17v4M3 12h4M17 12h4", "M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"],
  bolt: ["M13 2 3 14h9l-1 8 10-12h-9l1-8Z"],
  arrow: ["M5 12h14", "M13 5l7 7-7 7"],
  menu: ["M4 7h16M4 12h16M4 17h16"],
  close: ["M6 6l12 12M18 6 6 18"],
};

/* ───────────── Compte : session, appels authentifiés, fenêtre de connexion ───────────── */
const TOKEN_KEY = "di-session";
const readToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } };
const writeToken = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch { /* stockage indisponible : session limitée à l'onglet */ } };
const AuthCtx = React.createContext(null);
const useAuth = () => React.useContext(AuthCtx);
class ApiErr extends Error { constructor(m, status, data) { super(m); this.status = status; this.data = data; } }
async function apiCall(path, { method = "GET", body, token } = {}) {
  let r;
  try {
    r = await fetch(API + path, { method, credentials: "omit", cache: "no-store",
      headers: { ...(body !== undefined ? { "content-type": "application/json" } : {}), ...(token ? { authorization: "Bearer " + token } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body) });
  } catch { throw new ApiErr("Serveur injoignable. Vérifie ta connexion.", 0); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new ApiErr(r.status === 429 ? (d.error || "Trop de tentatives, réessaie plus tard.") : (d.error || "Erreur " + r.status), r.status, d);
  return d;
}

function AuthProvider({ children }) {
  const [token, setToken] = useState(readToken);
  const [user, setUser] = useState(null);      // { username, mustChange, unread }
  const [modal, setModal] = useState(null);    // null | "login" | "register" | "password"
  const logout = (silent) => {
    const t = token;
    writeToken(""); setToken(""); setUser(null);
    if (t && !silent) apiCall("/v1/account/logout", { method: "POST", body: {}, token: t }).catch(() => {});
  };
  // Appel authentifié : un 401 (session expirée ou révoquée) déconnecte
  const call = async (path, o = {}) => {
    try { return await apiCall(path, { ...o, token }); }
    catch (e) {
      if (e.status === 401) logout(true);
      if (e.status === 403 && e.data && e.data.mustChange) { setUser(u => u && { ...u, mustChange: true }); setModal("password"); }
      throw e;
    }
  };
  const refresh = async () => {
    if (!token) return;
    try { const me = await call("/v1/account/me"); setUser(me); if (me.mustChange) setModal("password"); } catch { /* 401 géré */ }
  };
  useEffect(() => {
    refresh();
    if (!token) return;
    const t = setInterval(() => { if (!document.hidden) refresh(); }, 60000);   // pastille « non lu » à jour
    return () => clearInterval(t);
  }, [token]);
  const signIn = (t, u) => { writeToken(t); setToken(t); setUser({ username: u.username, mustChange: u.mustChange, unread: 0 }); setModal(u.mustChange ? "password" : null); };
  const setUnread = n => setUser(u => u && { ...u, unread: n });
  const value = { token, user, modal, setModal, logout, call, signIn, refresh, setUnread };
  return <AuthCtx.Provider value={value}>{children}<AuthModal /></AuthCtx.Provider>;
}

function strength(p) {
  let s = 0;
  if (p.length >= 10) s++;
  if (p.length >= 14) s++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
  if (/\d/.test(p)) s++;
  if (/[^A-Za-z0-9]/.test(p)) s++;
  return Math.min(4, s);
}
const STRENGTH = [["Trop faible", "#FF453A"], ["Faible", "#FF9F0A"], ["Moyen", "#FFD60A"], ["Bon", "#30D158"], ["Excellent", "#22D3EE"]];
const RESERVED_NAMES = ["admin", "administrateur", "administrator", "root", "support", "moderator", "moderateur", "system", "dynamicisland", "staff"];

function PassInput({ id, label, value, onChange, error, autoComplete }) {
  const [show, setShow] = useState(false);
  return (
    <div>
      <label htmlFor={id} className="muted mb-1.5 block text-sm">{label}</label>
      <div className="relative">
        <input id={id} type={show ? "text" : "password"} value={value} onChange={e => onChange(e.target.value)} autoComplete={autoComplete} maxLength={128} aria-invalid={!!error}
          className="w-full rounded-2xl border bg-white/[.03] px-4 py-3 pr-24 outline-none transition-colors" style={{ borderColor: error ? '#FF453A' : 'var(--line)' }} />
        <button type="button" onClick={() => setShow(s => !s)} className="muted absolute right-2 top-1/2 -translate-y-1/2 rounded-full px-3 py-1.5 text-xs hover:text-white" aria-pressed={show} aria-label={show ? "Masquer le mot de passe" : "Afficher le mot de passe"}>{show ? "Masquer" : "Afficher"}</button>
      </div>
      {error && <p className="mt-1.5 text-sm" style={{ color: '#FF453A' }}>{error}</p>}
    </div>
  );
}

function AuthModal() {
  const a = useAuth();
  const mode = a.modal;
  const [f, setF] = useState({ username: "", password: "", confirm: "", old: "" });
  const [err, setErr] = useState({});
  const [fail, setFail] = useState("");
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState("");
  const hp = useRef(null);
  const forced = mode === "password" && !!(a.user && a.user.mustChange);
  useEffect(() => { setErr({}); setFail(""); setDone(""); setF(x => ({ ...x, password: "", confirm: "", old: "" })); }, [mode]);
  useEffect(() => {
    if (!mode) return;
    const k = e => { if (e.key === "Escape" && !forced) a.setModal(null); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [mode, forced]);
  const set = k => v => { setF(x => ({ ...x, [k]: v })); setErr(e => ({ ...e, [k]: undefined })); setFail(""); };
  const close = () => { if (!forced) a.setModal(null); };

  const submit = async e => {
    e.preventDefault();
    if (busy) return;
    const n = {}, u = f.username.trim();
    if (mode !== "password") {
      if (!/^[A-Za-z0-9_.-]{3,20}$/.test(u)) n.username = "3 à 20 caractères : lettres, chiffres, _ . -";
      else if (mode === "register" && RESERVED_NAMES.includes(u.toLowerCase().replace(/[_.-]/g, ""))) n.username = "Ce nom est réservé.";
    }
    if (mode === "password" && !f.old) n.old = "Indique ton mot de passe actuel.";
    if (mode === "login") { if (!f.password) n.password = "Indique ton mot de passe."; }
    else {
      const name = mode === "password" ? (a.user ? a.user.username : "") : u;
      if (f.password.length < 10) n.password = "10 caractères minimum.";
      else if (f.password.toLowerCase() === name.toLowerCase()) n.password = "Ne réutilise pas ton nom d'utilisateur.";
      if (f.confirm !== f.password) n.confirm = "Les deux mots de passe ne correspondent pas.";
    }
    setErr(n);
    if (Object.keys(n).length) return;
    setBusy(true); setFail("");
    try {
      if (mode === "password") {
        await a.call("/v1/account/password", { method: "POST", body: { old: f.old, new: f.password } });
        await a.refresh();
        setDone("Mot de passe changé. Tes autres appareils ont été déconnectés.");
        setTimeout(() => a.setModal(null), 1600);
      } else {
        if (mode === "register") await apiCall("/v1/account/register", { method: "POST", body: { username: u, password: f.password, website: hp.current ? hp.current.value : "" } });
        const r = await apiCall("/v1/account/login", { method: "POST", body: { username: u, password: f.password } });
        a.signIn(r.token, r);
      }
    } catch (x) {
      const m = String(x.message || "");
      setFail(m && m.length < 160 ? m.charAt(0).toUpperCase() + m.slice(1) : "Une erreur est survenue.");
    } finally { setBusy(false); }
  };

  const st = strength(f.password);
  return (
    <AnimatePresence>
      {mode && (
        <motion.div key="auth" className="fixed inset-0 z-[80] grid place-items-center p-4" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .25 }}>
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={close} aria-hidden="true" />
          <motion.div role="dialog" aria-modal="true" aria-labelledby="auth-title" className="glass relative w-full max-w-md rounded-[32px] p-6 md:p-8"
            initial={{ opacity: 0, y: 30, scale: .96 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 20, scale: .96 }} transition={{ duration: .4, ease: EASE }}>
            {!forced && <button onClick={close} className="muted absolute right-4 top-4 rounded-full p-2 hover:text-white" aria-label="Fermer"><Icon d={I.close} className="h-5 w-5" /></button>}
            {mode === "password" ? (
              <h2 id="auth-title" className="pr-10 text-2xl font-bold">{forced ? "Choisis un nouveau mot de passe" : "Changer le mot de passe"}</h2>
            ) : (
              <div className="relative mr-10 grid grid-cols-2 rounded-full bg-white/5 p-1" role="tablist" id="auth-title" aria-label="Compte">
                {[["login", "Se connecter"], ["register", "Créer un compte"]].map(([m, l]) => (
                  <button key={m} type="button" role="tab" aria-selected={mode === m} onClick={() => a.setModal(m)} className={"relative rounded-full py-2.5 text-sm font-semibold transition-colors " + (mode === m ? "text-black" : "muted hover:text-white")}>
                    {mode === m && <motion.span layoutId="authtab" className="absolute inset-0 rounded-full bg-white" transition={{ type: "spring", stiffness: 400, damping: 32 }} />}
                    <span className="relative">{l}</span>
                  </button>
                ))}
              </div>
            )}
            {forced && <p className="muted mt-2 text-sm">Ton mot de passe a été réinitialisé par l'admin. Saisis le mot de passe temporaire reçu, puis choisis le tien.</p>}
            <form onSubmit={submit} noValidate className="mt-6 grid gap-4">
              {mode !== "password" && (
                <div>
                  <label htmlFor="a-user" className="muted mb-1.5 block text-sm">Nom d'utilisateur</label>
                  <input id="a-user" value={f.username} onChange={e => set("username")(e.target.value)} autoComplete="username" maxLength={20} aria-invalid={!!err.username} autoFocus
                    className="w-full rounded-2xl border bg-white/[.03] px-4 py-3 outline-none transition-colors" style={{ borderColor: err.username ? '#FF453A' : 'var(--line)' }} />
                  {err.username && <p className="mt-1.5 text-sm" style={{ color: '#FF453A' }}>{err.username}</p>}
                </div>
              )}
              {mode === "password" && <PassInput id="a-old" label={forced ? "Mot de passe temporaire" : "Mot de passe actuel"} value={f.old} onChange={set("old")} error={err.old} autoComplete="current-password" />}
              <PassInput id="a-pass" label={mode === "password" ? "Nouveau mot de passe" : "Mot de passe"} value={f.password} onChange={set("password")} error={err.password} autoComplete={mode === "login" ? "current-password" : "new-password"} />
              {mode !== "login" && (
                <>
                  <div aria-live="polite">
                    <div className="grid grid-cols-4 gap-1.5">{[0, 1, 2, 3].map(i => <motion.span key={i} className="h-1.5 rounded-full" animate={{ backgroundColor: f.password && i < Math.max(1, st) ? STRENGTH[st][1] : 'rgba(255,255,255,0.1)' }} />)}</div>
                    <p className="muted mt-1.5 text-xs">{f.password ? "Robustesse : " + STRENGTH[st][0] + ". " : ""}10 caractères minimum ; une phrase de plusieurs mots est idéale.</p>
                  </div>
                  <PassInput id="a-conf" label="Confirme le mot de passe" value={f.confirm} onChange={set("confirm")} error={err.confirm} autoComplete="new-password" />
                </>
              )}
              {mode === "register" && (
                <div aria-hidden="true" style={{ position: "absolute", left: "-10000px", width: 1, height: 1, overflow: "hidden" }}>
                  <label htmlFor="a-website">Site web (laisser vide)</label>
                  <input ref={hp} id="a-website" name="website" type="text" tabIndex={-1} autoComplete="off" defaultValue="" />
                </div>
              )}
              {fail && <p role="alert" className="text-sm" style={{ color: '#ff6b6b' }}>{fail}</p>}
              {done && <p role="status" className="text-sm" style={{ color: '#30D158' }}>{done}</p>}
              <motion.button whileHover={{ y: -2 }} whileTap={{ scale: .97 }} type="submit" disabled={busy} aria-busy={busy} className="mt-1 rounded-full bg-white py-3.5 font-semibold text-black disabled:opacity-60">
                {busy ? "Un instant…" : mode === "login" ? "Se connecter" : mode === "register" ? "Créer mon compte" : "Changer le mot de passe"}
              </motion.button>
              {mode === "login" && <p className="muted text-center text-xs">Mot de passe oublié ? Écris-moi sur Discord : je te donnerai un mot de passe temporaire.</p>}
              {forced && <button type="button" onClick={() => { a.setModal(null); a.logout(); }} className="muted text-sm hover:text-white">Se déconnecter</button>}
            </form>
          </motion.div>
        </motion.div>
      )}
    </AnimatePresence>
  );
}

function AccountButton({ go, onNav }) {
  const a = useAuth();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const f = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const k = e => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("pointerdown", f); window.addEventListener("keydown", k);
    return () => { document.removeEventListener("pointerdown", f); window.removeEventListener("keydown", k); };
  }, [open]);
  if (!a.user) return <button onClick={() => a.setModal("login")} className="muted rounded-full px-3 py-2 text-sm font-semibold hover:text-white">Connexion</button>;
  const n = a.user.unread || 0;
  const item = (label, fn) => <button role="menuitem" onClick={() => { setOpen(false); if (onNav) onNav(); fn(); }} className="block w-full rounded-2xl px-4 py-2.5 text-left text-sm hover:bg-white/10">{label}</button>;
  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(o => !o)} aria-haspopup="menu" aria-expanded={open} className="relative flex items-center gap-2 rounded-full bg-white/5 py-1 pl-1 pr-3 text-sm hover:bg-white/10"
        aria-label={"Compte " + a.user.username + (n ? ", " + n + " message" + (n > 1 ? "s" : "") + " non lu" + (n > 1 ? "s" : "") : "")}>
        <span className="grid h-7 w-7 place-items-center rounded-full text-xs font-bold text-white" style={{ background: 'linear-gradient(135deg,var(--violet),var(--cyan))' }}>{a.user.username.charAt(0).toUpperCase()}</span>
        <span className="hidden max-w-[110px] truncate sm:inline">{a.user.username}</span>
        {n > 0 && <motion.span initial={{ scale: 0 }} animate={{ scale: 1 }} className="absolute -right-1 -top-1 grid h-5 min-w-[20px] place-items-center rounded-full px-1 text-[11px] font-bold text-white" style={{ background: '#FF453A' }}>{n > 9 ? "9+" : n}</motion.span>}
      </button>
      <AnimatePresence>
        {open && (
          <motion.div role="menu" initial={{ opacity: 0, y: -6, scale: .97 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: -6, scale: .97 }} transition={{ duration: .2, ease: EASE }}
            className="glass absolute right-0 mt-2 w-60 rounded-3xl p-2">
            {item("Messages" + (n ? " (" + n + ")" : ""), () => go("apropos", "contact"))}
            {item("Changer le mot de passe", () => a.setModal("password"))}
            {item("Se déconnecter", () => a.logout())}
          </motion.div>
        )}
      </AnimatePresence>
    </div>
  );
}

/* ───────────── Navigation ───────────── */
function Nav({ page, go }) {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const f = () => setScrolled(window.scrollY > 20);
    f(); window.addEventListener('scroll', f, { passive: true });
    return () => window.removeEventListener('scroll', f);
  }, []);
  const nav = id => { setOpen(false); go(id); };
  return (
    <header className="fixed inset-x-0 z-50 gutter" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 12px)' }}>
      <motion.nav
        initial={reduce ? false : { y: -40, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ duration: 1, ease: EASE, delay: .2 }}
        className={"glass mx-auto flex max-w-5xl items-center justify-between rounded-full py-2 pl-5 pr-2 transition-shadow " + (scrolled ? "shadow-[0_10px_40px_rgba(0,0,0,.6)]" : "")}
        aria-label="Navigation principale">
        <button onClick={() => nav("accueil")} className="flex items-center gap-2 font-semibold tracking-tight">
          <span className="inline-block h-3 w-7 rounded-full" style={{ background: 'linear-gradient(90deg,var(--violet),var(--cyan))' }} />
          Dynamic Island
        </button>

function Counter({ to, suffix = "", decimals = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-80px" });
  const [v, setV] = useState(reduce ? to : 0);
  useEffect(() => {
    if (!inView || reduce) { setV(to); return; }
    let raf, t0;
    const step = t => { t0 ??= t; const p = Math.min(1, (t - t0) / 1800); setV(to * (1 - Math.pow(1 - p, 4))); if (p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [inView, to]);
  return <span ref={ref} className="tnum">{v.toFixed(decimals)}{suffix}</span>;
}

const fmtTime = ms => {
  const d = new Date(ms), now = new Date();
  const t = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? t : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " · " + t;
};
function Chat() {
  const a = useAuth();
  const [msgs, setMsgs] = useState(null);
  const [text, setText] = useState("");
  const [fail, setFail] = useState("");
  const box = useRef(null);
  const seq = useRef(0);
  const load = async () => {
    try {
      const d = await a.call("/v1/messages");
      setMsgs(old => [...d.messages, ...(old || []).filter(m => m.pending || m.failed)]);
      setFail("");
      if (d.unread && !document.hidden) { await a.call("/v1/messages/read", { method: "POST", body: {} }).catch(() => {}); }
      a.setUnread(0);
    } catch (e) { if (e.status !== 401 && e.status !== 403) setFail(e.message); }
  };
  useEffect(() => {
    load();
    const t = setInterval(() => { if (!document.hidden) load(); }, 20000);
    const v = () => { if (!document.hidden) load(); };
    document.addEventListener("visibilitychange", v);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", v); };
  }, [a.token]);
  useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [msgs && msgs.length]);

  const send = async (body, retryKey) => {
    const t = (body ?? text).trim();
    if (!t) return;
    if (t.length > 5000) { setFail("5000 caractères maximum."); return; }
    const key = retryKey || "p" + (++seq.current);
    setMsgs(m => [...(m || []).filter(x => x.key !== key), { key, from: "user", text: t, at: Date.now(), pending: true }]);
    if (body === undefined) setText("");
    setFail("");
    try {
      const r = await a.call("/v1/messages", { method: "POST", body: { text: t } });
      setMsgs(m => (m || []).map(x => x.key === key ? r.message : x));
    } catch (e) {
      setMsgs(m => (m || []).map(x => x.key === key ? { ...x, pending: false, failed: true } : x));
      setFail(e.status === 429 ? "Trop de messages envoyés. Réessaie dans une heure." : e.message);
    }
  };
  const onKey = e => { if (e.key === "Enter" && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); send(); } };

  return (
    <div className="flex h-[min(560px,70vh)] flex-col">
      <div className="flex items-center gap-3 border-b pb-4" style={{ borderColor: 'var(--line)' }}>
        <span className="grid h-10 w-10 place-items-center rounded-full font-bold text-white" style={{ background: 'linear-gradient(135deg,var(--violet),var(--cyan))' }}>A</span>
        <div className="min-w-0 flex-1"><p className="font-semibold">Admin</p><p className="muted truncate text-xs">Conversation privée · connecté en tant que {a.user.username}</p></div>
      </div>
      <div ref={box} className="flex-1 space-y-3 overflow-y-auto py-4 pr-1" aria-live="polite" aria-label="Messages">
        {msgs === null ? <p className="muted text-center text-sm">Chargement…</p>
          : msgs.length === 0 ? <p className="muted py-10 text-center text-sm">Aucun message pour le moment. Pose ta question, je te réponds ici.</p>
          : msgs.map((m, i) => {
            const mine = m.from === "user";
            return (
              <motion.div key={m.key || (m.at + "-" + i)} initial={reduce ? false : { opacity: 0, y: 8, scale: .98 }} animate={{ opacity: 1, y: 0, scale: 1 }} transition={{ duration: .3, ease: EASE }}
                className={"flex flex-col " + (mine ? "items-end" : "items-start")}>
                {!mine && <span className="mb-1 ml-3 text-xs font-semibold" style={{ color: 'var(--cyan)' }}>Admin</span>}
                <div className={"max-w-[85%] whitespace-pre-wrap break-words rounded-3xl px-4 py-2.5 " + (mine ? "rounded-br-lg text-white" : "rounded-bl-lg bg-white/[.07]")}
                  style={mine ? { background: 'linear-gradient(135deg,rgba(139,92,246,.85),rgba(34,211,238,.75))', opacity: m.pending ? .6 : 1 } : undefined}>{m.text}</div>
                <span className="muted mx-3 mt-1 text-[11px]">
                  {m.failed ? <button onClick={() => send(m.text, m.key)} className="font-semibold" style={{ color: '#FF453A' }}>Échec de l'envoi · Réessayer</button> : m.pending ? "Envoi…" : fmtTime(m.at)}
                </span>
              </motion.div>
            );
          })}
      </div>
      {fail && <p role="alert" className="mb-2 text-sm" style={{ color: '#ff6b6b' }}>{fail}</p>}
      <form onSubmit={e => { e.preventDefault(); send(); }} className="flex items-end gap-2 border-t pt-4" style={{ borderColor: 'var(--line)' }}>
        <label htmlFor="chat-input" className="sr-only">Ton message</label>
        <textarea id="chat-input" rows={1} value={text} onChange={e => setText(e.target.value)} onKeyDown={onKey} maxLength={5000} placeholder="Écris ton message… (Entrée pour envoyer, Maj+Entrée pour aller à la ligne)"
          className="max-h-40 min-h-[48px] flex-1 resize-y rounded-3xl border bg-white/[.03] px-4 py-3 outline-none" style={{ borderColor: 'var(--line)' }} />

          <Icon d={I.arrow} className="h-5 w-5" />
        </motion.button>
      </form>
    </div>
  );
}

  const go = (id, anchor) => {
    const toAnchor = () => { let n = 0; const t = setInterval(() => { const el = document.getElementById(anchor); if (el || ++n > 40) { clearInterval(t); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); } }, 50); };
    if (id === page) { if (anchor) toAnchor(); else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    location.hash = id; setPage(id); window.scrollTo({ top: 0 });
    if (anchor) setTimeout(toAnchor, 600);
  };

  const view = {
    accueil: <Accueil go={go} />,
    technologie: <Technologie />,
    configurer: <Configurer />,
    apropos: <APropos />,
  }[page];

  return (
    <AuthProvider>
      <Nav page={page} go={go} />
      <AnimatePresence mode="wait">
        <motion.main key={page}
          initial={reduce ? false : { opacity: 0, y: 24, filter: "blur(10px)" }}
          animate={{ opacity: 1, y: 0, filter: "blur(0px)" }}
          exit={reduce ? {} : { opacity: 0, y: -16, filter: "blur(10px)" }}
          transition={{ duration: .55, ease: EASE }}>
          {view}
        </motion.main>
      </AnimatePresence>
      <Footer go={go} />
    </AuthProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
